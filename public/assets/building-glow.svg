<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.1" result="blurTight"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4.5" result="blurWide"/>
      <feMerge>
        <feMergeNode in="blurWide"/>
        <feMergeNode in="blurTight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="swooshGlow" x="-60%" y="-100%" width="220%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blurTight"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blurWide"/>
      <feMerge>
        <feMergeNode in="blurWide"/>
        <feMergeNode in="blurTight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="swooshGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8bd3f" stop-opacity="0"/>
      <stop offset="18%" stop-color="#e8bd3f" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f6dfa0" stop-opacity="1"/>
      <stop offset="82%" stop-color="#e8bd3f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e8bd3f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- glowing swoosh underline -->
  <path d="M 28 226 C 110 252, 330 252, 412 226" fill="none" stroke="url(#swooshGrad)"
        stroke-width="3.2" stroke-linecap="round" filter="url(#swooshGlow)"/>

  <!-- building line art -->
  <g fill="none" stroke="#efd49b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)">

    <!-- steps -->
    <line x1="150" y1="196" x2="290" y2="196"/>
    <line x1="158" y1="190" x2="282" y2="190"/>
    <line x1="166" y1="184" x2="274" y2="184"/>

    <!-- left wing -->
    <rect x="58" y="142" width="108" height="42" rx="1"/>
    <line x1="48" y1="142" x2="176" y2="142"/>
    <rect x="72" y="156" width="16" height="24"/>
    <rect x="104" y="156" width="16" height="24"/>
    <rect x="136" y="156" width="16" height="24"/>

    <!-- right wing (mirrored) -->
    <rect x="274" y="142" width="108" height="42" rx="1"/>
    <line x1="264" y1="142" x2="392" y2="142"/>
    <rect x="288" y="156" width="16" height="24"/>
    <rect x="320" y="156" width="16" height="24"/>
    <rect x="352" y="156" width="16" height="24"/>

    <!-- central portico block -->
    <rect x="172" y="128" width="96" height="56" rx="1"/>
    <line x1="172" y1="140" x2="268" y2="140"/>

    <!-- columns -->
    <line x1="184" y1="140" x2="184" y2="184"/>
    <line x1="198" y1="140" x2="198" y2="184"/>
    <line x1="212" y1="140" x2="212" y2="184"/>
    <line x1="228" y1="140" x2="228" y2="184"/>
    <line x1="242" y1="140" x2="242" y2="184"/>
    <line x1="256" y1="140" x2="256" y2="184"/>

    <!-- entablature above columns -->
    <line x1="166" y1="128" x2="274" y2="128"/>

    <!-- pediment (triangle) -->
    <path d="M 166 128 L 220 78 L 274 128"/>

    <!-- medallion / clock in pediment -->
    <circle cx="220" cy="110" r="10"/>
    <line x1="220" y1="103" x2="220" y2="110"/>
    <line x1="220" y1="110" x2="225" y2="113"/>

    <!-- finial -->
    <line x1="220" y1="78" x2="220" y2="56"/>
    <path d="M 220 56 L 232 62 L 220 68 Z"/>

  </g>
</svg>
